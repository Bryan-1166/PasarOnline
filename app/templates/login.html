
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PasarOnline</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f2;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            color: #198754;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #146c43;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        .success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PasarOnline</h1>
    <p class="subtitle">Silakan login ke akun Anda</p>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <div class="footer">
        Belum punya akun?
        <a href="/auth/register">Daftar sekarang</a>
    </div>

</div>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        button.disabled = true;
        button.textContent = "Memproses...";

        const data = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || "Login gagal"
                );
            }

            message.className = "message success";
            message.textContent = "Login berhasil! Mengalihkan...";

            const role = result.user.role;

const destinations = {
    user: "/customer/catalog/dashboard",
    producer: "/producer/profile/page",
    driver: "/driver/dashboard",
    admin: "/dashboard/admin/page"
};

            setTimeout(function() {
                window.location.href =
                    destinations[role] || "/";
            }, 700);

        } catch (error) {
            message.className = "message error";
            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Login";
        }
    });
</script>

</body>
</html>
