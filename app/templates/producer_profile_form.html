
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Profil Toko - PasarOnline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        p {
            color: #666;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            color: #dc3545;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Lengkapi Profil Toko</h1>

    <p>
        Halo, {{ user.full_name }}.
        Lengkapi informasi toko sebelum mulai mengelola produk.
    </p>

    <form id="profileForm">

        <label for="shop_name">Nama Toko *</label>
        <input
            type="text"
            id="shop_name"
            name="shop_name"
            minlength="3"
            maxlength="150"
            required
        >

        <label for="phone">Nomor Telepon *</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            minlength="8"
            maxlength="20"
            required
        >

        <label for="description">Deskripsi Toko</label>
        <textarea
            id="description"
            name="description"
        ></textarea>

        <label for="market_name">Nama Pasar *</label>
        <input
            type="text"
            id="market_name"
            name="market_name"
            minlength="3"
            maxlength="150"
            required
        >

        <label for="block">Blok</label>
        <input
            type="text"
            id="block"
            name="block"
            maxlength="50"
        >

        <label for="stall_number">Nomor Kios *</label>
        <input
            type="text"
            id="stall_number"
            name="stall_number"
            maxlength="50"
            required
        >

        <label for="floor">Lantai</label>
        <input
            type="text"
            id="floor"
            name="floor"
            maxlength="50"
        >

        <button type="submit" id="submitButton">
            Simpan Profil Toko
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        button.disabled = true;
        button.textContent = "Menyimpan...";

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        for (const key of ["description", "block", "floor"]) {
            if (!data[key] || !data[key].trim()) {
                data[key] = null;
            }
        }

        try {
            const response = await fetch("/producer/profile", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                message.textContent =
                    result.detail || "Gagal menyimpan profil toko.";

                button.disabled = false;
                button.textContent = "Simpan Profil Toko";
                return;
            }

            message.style.color = "green";
            message.textContent = "Profil toko berhasil disimpan!";

            window.location.href = "/producer/products/page";

        } catch (error) {
            message.textContent =
                "Terjadi kesalahan koneksi ke server.";

            button.disabled = false;
            button.textContent = "Simpan Profil Toko";
        }
    });
</script>

</body>
</html>
