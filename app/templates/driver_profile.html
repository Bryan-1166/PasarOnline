
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Driver - PasarOnline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .profile-item {
            padding: 15px;
            margin-top: 12px;
            background: #f7f8fa;
            border-radius: 8px;
        }

        .profile-item strong {
            display: block;
            margin-bottom: 7px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .logout {
            background: #dc3545;
            margin-left: 5px;
        }

        .logout:hover {
            background: #bb2d3b;
        }

        @media (max-width: 500px) {
            .btn {
                width: 100%;
                margin-left: 0;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Profil Driver</h1>

    <p>Informasi akun Driver PasarOnline.</p>

    <div class="profile-item">
        <strong>Nama Lengkap</strong>
        {{ user.full_name }}
    </div>

    <div class="profile-item">
        <strong>Email</strong>
        {{ user.email }}
    </div>

    <div class="profile-item">
        <strong>Nomor Telepon</strong>
        {{ driver.phone }}
    </div>

    <div class="profile-item">
        <strong>Status Driver</strong>
        <span class="status">{{ driver.status }}</span>
    </div>

    <a href="/driver/dashboard" class="btn">
        Kembali ke Dashboard
    </a>

    <button
        type="button"
        class="btn logout"
        onclick="logout()"
    >
        Logout
    </button>

</div>

<script>

    async function logout() {

        const konfirmasi = confirm(
            "Apakah Anda yakin ingin logout?"
        );

        if (!konfirmasi) {
            return;
        }

        try {

            const response = await fetch("/auth/logout", {
                method: "POST"
            });

            if (response.ok) {

                window.location.href = "/auth/login";

            } else {

                alert("Gagal logout. Silakan coba lagi.");

            }

        } catch (error) {

            alert("Terjadi kesalahan koneksi ke server.");

        }

    }

</script>

</body>
</html>
