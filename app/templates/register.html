
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PasarOnline</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f2;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            color: #198754;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 17px;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #146c43;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        .success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PasarOnline</h1>
    <p class="subtitle">Buat akun PasarOnline Anda</p>

    <div id="message" class="message"></div>

    <form id="registerForm">

        <label>Nama Lengkap</label>
        <input
            type="text"
            id="full_name"
            minlength="3"
            maxlength="150"
            placeholder="Masukkan nama lengkap"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            maxlength="255"
            placeholder="Masukkan email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            minlength="8"
            maxlength="128"
            placeholder="Minimal 8 karakter"
            required
        >

        <label>Konfirmasi Password</label>
        <input
            type="password"
            id="confirm_password"
            minlength="8"
            maxlength="128"
            placeholder="Ulangi password"
            required
        >

        <label>Daftar Sebagai</label>
        <select id="role" required>
            <option value="user">Pelanggan</option>
            <option value="producer">Producer / Penjual</option>
            <option value="driver">Driver / Kurir</option>
        </select>

        <div id="phoneGroup" class="hidden">
            <label>Nomor Telepon</label>
            <input
                type="tel"
                id="phone"
                maxlength="20"
                placeholder="Masukkan nomor telepon"
            >
        </div>

        <button type="submit" id="registerButton">
            Daftar
        </button>

    </form>

    <div class="footer">
        Sudah punya akun?
        <a href="/auth/login">Login di sini</a>
    </div>

</div>

<script>
    const form = document.getElementById("registerForm");
    const role = document.getElementById("role");
    const phoneGroup = document.getElementById("phoneGroup");
    const phoneInput = document.getElementById("phone");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    function updatePhoneField() {
        const selectedRole = role.value;

        if (
            selectedRole === "driver" ||
            selectedRole === "producer"
        ) {
            phoneGroup.classList.remove("hidden");
        } else {
            phoneGroup.classList.add("hidden");
            phoneInput.value = "";
        }

        phoneInput.required = selectedRole === "driver";
    }

    role.addEventListener("change", updatePhoneField);

    updatePhoneField();

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {
            message.className = "message error";
            message.textContent =
                "Konfirmasi password tidak cocok";
            return;
        }

        button.disabled = true;
        button.textContent = "Mendaftarkan...";

        const selectedRole = role.value;

        const data = {
            full_name: document.getElementById("full_name").value,
            email: document.getElementById("email").value,
            password: password,
            confirm_password: confirmPassword,
            role: selectedRole,
            phone: phoneInput.value.trim() || null
        };

        try {
            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                let errorText = result.detail || "Registrasi gagal";

                if (Array.isArray(errorText)) {
                    errorText = errorText
                        .map(item => item.msg)
                        .join(", ");
                }

                throw new Error(errorText);
            }

            message.className = "message success";
            message.textContent =
                "Registrasi berhasil! Mengalihkan ke halaman login...";

            setTimeout(function() {
                window.location.href = "/auth/login";
            }, 1200);

        } catch (error) {
            message.className = "message error";
            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Daftar";
        }
    });
</script>

</body>
</html>
